<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PRO SAN" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>PRO SAN — Senior Software Engineer & AI Architect</title>
    <meta name="description" content="Production-ready, modern, high-performance personal portfolio website for PRO SAN, Senior Software Engineer, Full-Stack & AI Automation Developer featuring projects showcase, interactive skills matrix, experience timeline, and contact system." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PRO SAN — Senior Software Engineer & AI Architect" />
    <meta property="og:description" content="Explore cutting-edge full-stack web applications, AI automation systems, cloud architectures, and open-source contributions by PRO SAN." />
    <meta property="og:image" content="/images/og-preview.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PRO SAN — Senior Software Engineer & AI Architect" />
    <meta name="twitter:description" content="Explore cutting-edge full-stack web applications, AI automation systems, cloud architectures, and open-source contributions by PRO SAN." />
    <meta name="twitter:image" content="/images/og-preview.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark) || saved === 'system' && prefersDark) {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-sans transition-colors duration-200 selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
